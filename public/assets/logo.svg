<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- TV Screen Badge -->
  <rect x="5" y="8" width="46" height="42" rx="10" fill="#141824" stroke="url(#goldGrad)" stroke-width="2.5" />
  <polygon points="23,20 37,29 23,38" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="43" cy="14" r="3" fill="#E50914" />
  
  <!-- Text SBTV -->
  <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">SB<tspan fill="url(#goldGrad)">TV</tspan></text>
  <!-- Subtitle FLIX -->
  <rect x="135" y="16" width="58" height="20" rx="4" fill="url(#glowGrad)" />
  <text x="141" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#FFFFFF">STREAM</text>
  <text x="63" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#8892B0">M3U MEDIA PLAYER</text>
</svg>

